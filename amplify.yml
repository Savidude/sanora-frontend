version: 1
backend:
  phases:
    preBuild:
      commands:
        - echo "Installing backend dependencies"
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - echo "Deploying Amplify Gen 2 backend"
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        # Fetch configuration from SSM Parameter Store and inject as build-time env vars
        - echo "Fetching configuration from SSM Parameter Store..."
        - export VITE_COGNITO_USER_POOL_ID=$(aws ssm get-parameter --name "/sanora/cognito/user_pool_id" --query "Parameter.Value" --output text --region $AWS_REGION)
        - export VITE_COGNITO_CLIENT_ID=$(aws ssm get-parameter --name "/sanora/cognito/user_pool_client_id" --query "Parameter.Value" --output text --region $AWS_REGION)
        - export VITE_API_URL=$(aws ssm get-parameter --name "/sanora/apigw/messaging_service_url" --query "Parameter.Value" --output text --region $AWS_REGION)
        - export VITE_AWS_REGION=$AWS_REGION
        - echo "✓ Configuration loaded from SSM"
    build:
      commands:
        - echo "Building frontend application"
        - npm run build
    postBuild:
      commands:
